<!DOCTYPE html>
<html>
<head>
    <title>Introduction to JS Validation</title>
    <style>
    *form{
    padding:10px;
    margin:5px;
    border:10px;
    }
    </style>
    <script>
        function validateForm() {
            let name=document.getElementById("name").value
            let email=document.getElementById("email").value;
            let resume=document.getElementById("resume").value;
            let emailPattern=/^[^]+@[^]+\.[a-z]{2,3}$/;
            if(!name)
            if(!email.match(emailpattern)){
            alert("Invalid email");
            return false;
            }
            if(!resume.match(^.(pdf\doc\docx)$/i)){
            alert("Only Pdf/Doc/Docx are allowed");
            return false;
            }
            return true;
        }
    </script>
</head>
<body>
<h1 style="text-align:center">Job portal</h1>
<hr>
<form onsubmit="return validateForm()" style="text-align:center;background-color:#8926;">
    <input type="text" id="name" placeholder="Name"required><br><br>
    <input type="email" id="email" placeholder="Email"required><br><br>
    <h3>Upload your resume</h3>
    <input type="file" id="resume" required><br><br>
    <button type="submit">Register</button><br><br>
</form>
<hr>
</body>
</html>
